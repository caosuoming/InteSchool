name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scanner: ${{ steps.filter.outputs.scanner }}
      container: ${{ steps.filter.outputs.container }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          if ! curl --fail --location --silent --show-error --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"; then
            gh api -H 'Accept: application/octet-stream' \
              repos/rhysd/actionlint/releases/assets/384924896 > "$archive"
          fi
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scanner:
              - 'scripts/scanner-*.mjs'
              - 'scripts/scanner-*.ps1'
              - 'packaging/windows/**'
              - '.github/workflows/scanner-installer.yml'
              - '.github/workflows/scanner-release.yml'
              - '.github/workflows/ci.yml'
            container:
              - 'server/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/check-mathtype-runtime.mjs'
              - '.github/workflows/container-smoke.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            dependencies:
              - 'package.json'
              - 'package-lock.json'

  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify build outputs
        run: test -f dist/index.html && test -f build/server/server/index.js

  dependencies:
    name: Audit changed dependencies
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high

  scanner:
    name: Windows scanner package
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.scanner == 'true'
    uses: ./.github/workflows/scanner-installer.yml
    permissions:
      contents: read

  container:
    name: Container smoke test
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true'
    uses: ./.github/workflows/container-smoke.yml
    permissions:
      contents: read

  gate:
    name: Required checks
    if: always()
    needs: [changes, quality, tests, build, dependencies, scanner, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      QUALITY: ${{ needs.quality.result }}
      TESTS: ${{ needs.tests.result }}
      BUILD: ${{ needs.build.result }}
      DEPENDENCIES: ${{ needs.dependencies.result }}
      SCANNER: ${{ needs.scanner.result }}
      CONTAINER: ${{ needs.container.result }}
    steps:
      - name: Require all applicable checks
        shell: bash
        run: |
          printf 'changes=%s quality=%s tests=%s build=%s dependencies=%s scanner=%s container=%s\n' \
            "$CHANGES" "$QUALITY" "$TESTS" "$BUILD" "$DEPENDENCIES" "$SCANNER" "$CONTAINER"
          test "$CHANGES" = success
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$BUILD" = success
          [[ "$DEPENDENCIES" == success || "$DEPENDENCIES" == skipped ]]
          [[ "$SCANNER" == success || "$SCANNER" == skipped ]]
          [[ "$CONTAINER" == success || "$CONTAINER" == skipped ]]
