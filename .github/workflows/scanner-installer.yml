name: Windows scanner installer validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate scanner scripts on Windows
        shell: pwsh
        run: |
          foreach ($script in @('scanner-bridge.mjs','scanner-devices.mjs','scanner-launcher.mjs','scanner-pairing.mjs')) {
            node --check "scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Invalid script $script" }
          }
          node --input-type=module -e "await import('./scripts/scanner-bridge.mjs'); await import('./scripts/scanner-pairing.mjs');"
          if ($LASTEXITCODE -ne 0) { throw "Scanner scripts cannot be imported" }
          $script = (Resolve-Path packaging/windows/scanner-tray.ps1).Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "Windows PowerShell 5.1 requires UTF-8 BOM for Chinese tray text"
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Invalid scanner tray script: $($parseErrors | Out-String)" }
          $traySource = Get-Content -Raw -Encoding UTF8 $script
          if ($traySource -notmatch '\$menu\.Items\.Add\(''授权网站''\)') {
            throw "Scanner tray authorization action is missing"
          }
      - name: Prepare bundled Node runtime
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory packaging/windows/stage | Out-Null
          Copy-Item (Get-Command node).Source packaging/windows/stage/node.exe
          & packaging/windows/stage/node.exe --version
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "ISCC.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw "Inno Setup compiler missing" }
          & $compiler "packaging\windows\scanner-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup packaging failed" }
          Get-FileHash packaging/windows/stage/output/InteSchool-Scanner-Setup.exe -Algorithm SHA256 | Format-List
      - name: Install and smoke-test actual package
        shell: pwsh
        run: |
          $installer = (Resolve-Path packaging/windows/stage/output/InteSchool-Scanner-Setup.exe).Path
          # Simulate explicit consent to the optional installer task.
          $env:INTESCHOOL_SCANNER_ORIGINS_FILE = Join-Path $env:TEMP 'inteschool-ci-origins.json'
          Remove-Item -LiteralPath $env:INTESCHOOL_SCANNER_ORIGINS_FILE -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=authorizeOfficialWebsite' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\InteSchool Scanner'
          foreach ($file in @('node.exe','scanner-launch.vbs','scripts\scanner-bridge.mjs','scripts\scanner-wia.ps1','scripts\scanner-pairing.mjs')) {
            if (!(Test-Path (Join-Path $dir $file))) { throw "Missing installed asset $file" }
          }
          $pairedAfterInstall = @(Get-Content -Raw $env:INTESCHOOL_SCANNER_ORIGINS_FILE | ConvertFrom-Json)
          if ($pairedAfterInstall -cnotcontains 'https://inteschool.fwerkor.com') {
            throw "The installer did not authorize the site after explicit consent"
          }
          if ($pairedAfterInstall.Count -ne 1) { throw "Installer authorized unexpected websites" }
          & (Join-Path $dir 'node.exe') --input-type=module -e "import {approveOrigin} from './scripts/scanner-pairing.mjs'; await approveOrigin('https://test.inteschool.example');" 
          $protocolCommand = (Get-ItemProperty -Path 'HKCU:\Software\Classes\inteschool-scanner\shell\open\command').'(default)'
          if ($protocolCommand -notmatch 'scanner-launch.vbs') { throw "Protocol handler not registered" }
          # cscript must execute the installed VBS synchronously, checking the exit code.
          # Running wscript without checking its result previously allowed a syntax error
          # (800A03EE) to pass this smoke test undetected.
          $vbs = Join-Path $dir 'scanner-launch.vbs'
          if ([System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($vbs)) -match '[^\x00-\x7F]') {
            throw "VBScript must remain ASCII to avoid legacy Windows codepage parsing errors"
          }
          & (Join-Path $env:WINDIR 'System32\cscript.exe') '//Nologo' $vbs
          if ($LASTEXITCODE -ne 0) { throw "Installed scanner-launch.vbs failed (exit $LASTEXITCODE)" }
          & (Join-Path $env:WINDIR 'System32\cscript.exe') '//Nologo' $vbs
          if ($LASTEXITCODE -ne 0) { throw "Restarting installed launcher failed" }
          Start-Sleep -Seconds 5
          $trays = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'powershell.exe' -and $_.CommandLine -match 'scanner-tray[.]ps1' -and $_.CommandLine -notmatch ' -Stop' })
          if ($trays.Count -ne 1) { throw "Expected a single running tray controller, found $($trays.Count)" }
          $trayLog = Join-Path $env:LOCALAPPDATA 'InteSchool\Scanner\tray.log'
          if ((Test-Path $trayLog) -and (Get-Content -Raw $trayLog) -match 'Tray failed:') {
            throw "Tray exited with error: $(Get-Content -Tail 12 $trayLog)"
          }
          # Exercise the manual-tray authorization path: it invokes the launcher
          # with a validated custom-protocol URI after an explicit confirmation.
          & (Join-Path $dir 'node.exe') (Join-Path $dir 'scripts\scanner-launcher.mjs') 'inteschool-scanner://connect?origin=https%3A%2F%2Fmanual.example'
          if ($LASTEXITCODE -ne 0) { throw "Manual scanner pairing failed" }
          $paired = @(Get-Content -Raw $env:INTESCHOOL_SCANNER_ORIGINS_FILE | ConvertFrom-Json)
          if ($paired -notcontains 'https://manual.example') { throw "Manual scanner origin not persisted" }
          & (Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File (Join-Path $dir 'scanner-tray.ps1') -Restart
          if ($LASTEXITCODE -ne 0) { throw "Tray upgrade restart failed" }
          Start-Sleep -Seconds 4
          $trays = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'powershell.exe' -and $_.CommandLine -match 'scanner-tray[.]ps1' -and $_.CommandLine -notmatch ' -(Stop|Restart)' })
          if ($trays.Count -ne 1) { throw "Expected one tray after upgrade restart, found $($trays.Count)" }
          $code = @'
          import http from 'node:http';
          for (const [origin, expected] of [['https://test.inteschool.example', 200],['https://manual.example', 200],['https://other.example',403]]) {
            const status = await new Promise((resolve, reject) => {
              http.get('http://127.0.0.1:17380/health', {headers:{Origin:origin,'X-InteSchool-Scanner':'scanner-v1'}}, r => {r.resume();resolve(r.statusCode)}).on('error', reject);
            });
            if (status !== expected) throw Error(origin + ': '+status);
          }
          '@
          $code | & (Join-Path $dir 'node.exe') --input-type=module -
      - uses: actions/upload-artifact@v7
        with:
          name: inteschool-scanner-windows-installer
          path: packaging/windows/stage/output/InteSchool-Scanner-Setup.exe
          if-no-files-found: error
