services:
  inteschool:
    image: ghcr.io/caosuoming/inteschool:${INTESCHOOL_VERSION:-latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${INTESCHOOL_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      INTESCHOOL_DATA_DIR: /app/data
      INTESCHOOL_COOKIE_SECURE: ${INTESCHOOL_COOKIE_SECURE:-false}
      INTESCHOOL_TRUST_PROXY: ${INTESCHOOL_TRUST_PROXY:-false}
      INTESCHOOL_ENABLE_DEMO: ${INTESCHOOL_ENABLE_DEMO:-false}
      INTESCHOOL_SEED_DEMO_DATA: ${INTESCHOOL_SEED_DEMO_DATA:-false}
      INTESCHOOL_DEMO_EMAIL: ${INTESCHOOL_DEMO_EMAIL:-li.zhang@bj04.edu.cn}
      INTESCHOOL_DEMO_PASSWORD: ${INTESCHOOL_DEMO_PASSWORD:-}
      INTESCHOOL_BOOTSTRAP_ADMIN_EMAIL: ${INTESCHOOL_BOOTSTRAP_ADMIN_EMAIL:-}
      INTESCHOOL_BOOTSTRAP_ADMIN_PASSWORD: ${INTESCHOOL_BOOTSTRAP_ADMIN_PASSWORD:-}
      INTESCHOOL_BOOTSTRAP_ADMIN_NAME: ${INTESCHOOL_BOOTSTRAP_ADMIN_NAME:-平台管理员}
      INTESCHOOL_BOOTSTRAP_SCHOOL_ID: ${INTESCHOOL_BOOTSTRAP_SCHOOL_ID:-sch-1}
      INTESCHOOL_BOOTSTRAP_SCHOOL_NAME: ${INTESCHOOL_BOOTSTRAP_SCHOOL_NAME:-InteSchool 初始学校}
      INTESCHOOL_BOOTSTRAP_SCHOOL_CODE: ${INTESCHOOL_BOOTSTRAP_SCHOOL_CODE:-INITIAL}
      INTESCHOOL_BOOTSTRAP_SCHOOL_CITY: ${INTESCHOOL_BOOTSTRAP_SCHOOL_CITY:-}
      INTESCHOOL_AUTO_APPROVE_APPLICATIONS: ${INTESCHOOL_AUTO_APPROVE_APPLICATIONS:-false}
      INTESCHOOL_SESSION_DAYS: ${INTESCHOOL_SESSION_DAYS:-30}
      INTESCHOOL_MAX_UPLOAD_BYTES: ${INTESCHOOL_MAX_UPLOAD_BYTES:-52428800}
      INTESCHOOL_AI_BASE_URL: ${INTESCHOOL_AI_BASE_URL:-}
      INTESCHOOL_AI_API_KEY: ${INTESCHOOL_AI_API_KEY:-}
      INTESCHOOL_AI_MODEL: ${INTESCHOOL_AI_MODEL:-}
    volumes:
      - inteschool-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  inteschool-data:
